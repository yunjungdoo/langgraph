name: richspot-bootstrap-public-tools
on:
  push:
    branches: [richspot-h06h06-native-apk-build-20261005]
  workflow_dispatch:
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Collect public Android compile inputs
        run: |
          set -euxo pipefail
          mkdir -p out
          cp "$ANDROID_HOME/platforms/android-35/android.jar" out/android-35.jar
          curl -L --fail --retry 3 -o out/r8.jar https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.6.27/r8-8.6.27.jar
          java -cp out/r8.jar com.android.tools.r8.D8 --version | tee out/D8_VERSION.txt
          sha256sum out/* | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: richspot-public-android-build-tools-modern
          path: out/
          retention-days: 1
