name: richspot-bootstrap-public-tools
on:
  push:
    branches: [richspot-h06h06-native-apk-build-20261005]
  workflow_dispatch:
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Collect public Android packaging tools
        run: |
          set -euxo pipefail
          mkdir -p out/lib
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          cp "$BT/zipalign" out/zipalign
          cp "$BT/apksigner" out/apksigner
          cp "$BT/lib/apksigner.jar" out/lib/apksigner.jar
          chmod +x out/zipalign out/apksigner
          "$BT/apksigner" version | tee out/APKSIGNER_VERSION.txt
          "$BT/zipalign" -h >/dev/null 2>&1 || true
          sha256sum out/zipalign out/apksigner out/lib/apksigner.jar | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: richspot-public-android-packaging-tools
          path: out/
          retention-days: 1
